# Versions and publishes the public packages with Changesets.
#   - On every push to main with pending changesets: opens/updates the
#     "Version Packages" PR (versions + CHANGELOGs). Requires the org and
#     repo setting "Allow GitHub Actions to create and approve pull requests".
#   - When that PR merges: publishes to npm with provenance — only once the
#     repository variable NPM_PUBLISH is "true". Until then the step runs
#     pack:check instead, so the pipeline is exercised without a release.
# Authentication:
#   - Preferred: npm trusted publishing (OIDC via id-token: write) configured
#     on each package for widgentic/widgentic + release.yml. Needs npm >= 11.5.
#   - Bootstrap: trusted publishing can only be configured on a package that
#     already exists, so the FIRST publish uses a short-lived granular token in
#     the NPM_TOKEN secret. Delete the secret afterwards; the OIDC path takes
#     over automatically when it is absent.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency: release-${{ github.ref }}
env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm with trusted-publishing support
        run: npm install -g npm@latest && npm --version
      - name: Bootstrap token (first publish only)
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
      - run: npm ci
      - run: npm run build
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: ${{ vars.NPM_PUBLISH == 'true' && 'npm run release' || 'npm run pack:check' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
