# Versions and publishes the public packages with Changesets.
#   - On every push to main with pending changesets: opens/updates the
#     "Version Packages" PR (versions + CHANGELOGs).
#   - When that PR merges: publishes to npm with provenance — but only once the
#     repository variable NPM_PUBLISH is "true". Until then the step builds and
#     stops, so the pipeline can be exercised end to end without a release.
# Publishing uses npm trusted publishing (OIDC, id-token: write) configured on
# the @widgentic scope for this repository/workflow; no long-lived token.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency: release-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: ${{ vars.NPM_PUBLISH == 'true' && 'npm run release' || 'npm run pack:check' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
