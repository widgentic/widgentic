name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
  dotnet:
    # The .NET host (dotnet/): builds the host bundle from this checkout, then
    # runs the conformance corpus, the protocol tests and the sample on V8.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - run: npm ci
      - run: npm run build
      - run: dotnet test --solution Widgentic.slnx -c Release
        working-directory: dotnet
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check
  example-image:
    # Builds the image against the PUBLISHED @widgentic/* packages and
    # import-smokes the entries the services need, so a reader's first
    # `docker compose up` cannot be the first execution. Deliberately RED in
    # the window between landing a change that adds a package entry and the
    # release that publishes it — that redness is the signal to release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f examples/docker/Dockerfile -t widgentic-selfhost examples
  selfhost-source-image:
    # Builds the self-host image from THIS checkout's packages, packed and
    # installed as tarballs: the staging path for unreleased changes. Not a
    # required check — a red build here is a signal, not a merge block.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f examples/docker/Dockerfile.source -t widgentic-selfhost-source .
