<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>widgentic designer — demo host</title>
<style>
  /* The page's own palette is DERIVED, never retyped: main.ts injects
     chromeCss(CHROME_DEFAULTS, { prefix: "--host" }) so these --host-*
     properties are exactly what the designers paint with by default, and
     the designers paint with by default. The "Host chrome" toggle is the
     demo of overriding: the page swaps to its own hand-written palette below
     and hands the designers a map built from the same properties plus a serif
     typeface. Default state: no colour literal, nothing retyped. */
  :root { color-scheme: light dark; --host-radius: 6px; --host-shadow: 0 8px 24px -12px rgba(11, 27, 38, 0.35); }

  /* The "Host chrome" state: a host writing its OWN palette, which is the only
     way to override — the package ships one default and no second palette to
     fall back to. This one is Dracula (Zeno Rocha, MIT — draculatheme.com),
     mapped onto the chrome tokens with its official colours and nothing else.
     It is a DARK theme, so it stays dark in both schemes; that is what
     applying a theme like this means.

     Measured against the thresholds the built-in palette is held to, seven
     pairs fall short — all of them the Comment tone #6272a4 (muted, hl-punct)
     and the Current Line selection tone behind accents and the banner. An
     editor theme optimises for reading code, not for UI chrome, and adopting
     one brings that trade with it. That is the point of the demo: once you
     pass your own values, the contrast is yours to own. */
  :root[data-host-chrome="dracula"] {
    color-scheme: dark;
    --host-bg: #282a36;          /* Background     */
    --host-panel: #21222c;       /* ANSI black     */
    --host-hover: #44475a;       /* Current Line   */
    --host-border: #6272a4;      /* Comment        */
    --host-line: #44475a;        /* Current Line   */
    --host-text: #f8f8f2;        /* Foreground     */
    --host-muted: #6272a4;       /* Comment        */
    --host-accent: #bd93f9;      /* Purple         */
    --host-accent-bg: #44475a;   /* Current Line   */
    --host-accent-line: #bd93f9; /* Purple         */
    --host-danger: #ff5555;      /* Red            */
    --host-danger-bg: #44475a;   /* Current Line   */
    --host-danger-line: #ff5555; /* Red            */
    --host-hl-key: #8be9fd;      /* Cyan           */
    --host-hl-str: #f1fa8c;      /* Yellow         */
    --host-hl-num: #bd93f9;      /* Purple         */
    --host-hl-bool: #ff79c6;     /* Pink           */
    --host-hl-punct: #6272a4;    /* Comment        */
    --host-radius: 4px;
    --host-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
  }
  body {
    margin: 0;
    padding: 16px;
    font-family: var(--host-font);
    background: var(--host-bg);
    color: var(--host-text);
  }
  header {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--host-border);
  }
  header h1 { font-size: 18px; margin: 0; }
  #status, #agent-status { color: var(--host-muted); font-size: 12px; }
  button {
    font: inherit;
    padding: 4px 10px;
    border: 1px solid var(--host-border);
    border-radius: var(--host-radius);
    background: var(--host-panel);
    color: var(--host-text);
    cursor: pointer;
  }
  button:hover { background: var(--host-hover); }
  button.active { background: var(--host-hover); border-color: currentColor; font-weight: 600; }
  nav { display: flex; gap: 6px; margin-right: 8px; }
  header > span[id^="controls-"] { display: inline-flex; gap: 6px; }
  header > span[hidden] { display: none; }
</style>
<body>
  <header>
    <h1>widgentic designer</h1>
    <nav>
      <button id="tab-widget" type="button">Widget designer</button>
      <button id="tab-theme" type="button">Theme designer</button>
      <button id="tab-schema" type="button">Schema designer</button>
      <button id="tab-action" type="button">Action designer</button>
    </nav>
    <!-- Per-tab controls: seeds belong to the widget designer; every
         designer has the same Save-to-localStorage action, and what one
         saves the others consume. -->
    <span id="controls-widget">
      <button id="load-invoice" type="button">Load invoice</button>
      <button id="load-xpost" type="button">Load x-post</button>
      <button id="load-weather" type="button">Load weather</button>
      <button id="save-widget" type="button">Save widget</button>
    </span>
    <span id="controls-theme" hidden>
      <button id="save-theme" type="button">Save theme</button>
    </span>
    <span id="controls-schema" hidden>
      <button id="save-schema" type="button">Save schema</button>
    </span>
    <span id="controls-action" hidden>
      <button id="save-action" type="button">Save action</button>
    </span>
    <button id="chrome-toggle" type="button">Host chrome</button>
    <button id="reset" type="button">Reset all</button>
    <span id="status"></span>
    <span id="agent-status" title="WebMCP: the designers on this page are tools a browser-side agent can use; you save."></span>
  </header>
  <div id="widget-designer"></div>
  <div id="theme-designer" hidden></div>
  <div id="schema-designer" hidden></div>
  <div id="action-designer" hidden></div>
  <script type="module" src="./designer.bundle.js"></script>
</body>
